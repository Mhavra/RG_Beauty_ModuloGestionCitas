<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RG Beauty Spa {% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-pasteldink { background-color: #F4C2C2; }
        .text-pastelink { color: #D47A7A; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
    <nav class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
        <a href="{% url 'reserva_paso1' %}" class="text-2xl font-serif font-bold text-pastelink"> RG Beauty SPA</a>
        <div class="flex items-center space-x-3">
            {% if user.is_authenticated %}
                <span class="text-xs font-medium text-gray-600"> Hola, {{ user.first_name }}</span>
                {% if user.rol in 'admin, profesional' %}
                    <a href="{% url 'admin_dashboard' %}" class="bg-gray-800 text-white px-3 py-1 rounded text-xs">Panel Admin</a>
                {% endif %}
                <a href="{% url 'logout' %}" class="text-xs text-red-500 hover:underline">Salir</a>
            {% else %}
                <a href="{% url 'registro' %}" class="text-xs font-semibold bg-pasteldink text-gray-900 px-3 py-1.5 rounded-lg hover:opacity-90">Registrarse</a>
            {% endif %}
         </div>
    </nav>

    <main class="flex.grow container mx-auto px-4 py-8 max-w-2xl">
        {% block content %}{% endblock %}
    </main>
    
    <footer class="bg-white border-t text-center py-4 text-xs text-gray-400">
        &copy; 2026 RG Beauty Spa - Copiapó, Chile.
    </footer>
</body>
</html>
